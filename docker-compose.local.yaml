name: quicksend
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: quicksend_app
    volumes:
      - ./common:/app/common/
      - ./app:/app/app/
      - ./migrations:/app/migrations/
    env_file:
      - .env
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.70.0.2

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: quicksend_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.70.0.3

  kafka:
    image: bitnami/kafka:latest
    container_name: quicksend_kafka
    environment:
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      default:
        ipv4_address: 172.70.0.4
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:17
    container_name: quicksend_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASS}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 172.70.0.5

  redis:
    image: redis:8.4.0
    container_name: quicksend_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      default:
        ipv4_address: 172.70.0.6

  seq:
    image: datalust/seq:2025.2
    container_name: quicksend_seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINUSERNAME: "${SEQ_FIRSTRUN_ADMINUSERNAME}"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_FIRSTRUN_ADMINPASSWORD}"
    ports:
      - "5431:80"
    volumes:
      - seq_data:/data
    networks:
      default:
        ipv4_address: 172.70.0.7

  consumer:
    build:
      context: .
      dockerfile: docker/consumer/Dockerfile
    container_name: quicksend_consumer
    volumes:
      - ./common:/app/common/
      - ./consumer:/app/consumer/
    env_file:
      - .env
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.70.0.8

networks:
  default:
    name: ${DOCKER_NETWORK}
    external: true

volumes:
  redis_data:
  postgres_data:
  seq_data:
  kafka_data:
